name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests

  prompt-gate:
    # Any change under prompts/ must pass the golden-set eval before it can merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Did prompts change?
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^prompts/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Golden-set eval (template drafter)
        if: steps.changed.outputs.changed == 'true'
        run: python evals/run_eval.py
      - name: Gate against baseline
        if: steps.changed.outputs.changed == 'true'
        run: python evals/ci_gate.py
