version: "2.1.0"
name: breach_report
owner: market-risk-ai
purpose: Draft a short breach note. Every figure must come from a tool result or from FACTS. Output is constrained to a JSON schema.
changelog:
  - "2.1.0: tool prompt now requires the note to name the desk and state the classification in words. Added after the content check rejected notes that omitted the classification (3B model, first 12 scenarios)."
  - "2.0.0: system prompt separated; few-shot examples added; output constrained to the JSON schema {summary}; tool-calling mode added (figures must come from tool results)."
  - "1.1.0: added the rule that every figure must come from FACTS and the instruction to omit unsupported figures."
  - "1.0.0: first version."

system: |
  You are the drafting step of a market-risk workflow. A deterministic engine has already classified the case.
  Rules:
  1. Every figure you write must come from a tool result or from FACTS. Never compute, estimate, convert or round a figure.
  2. When tools are available, call them to obtain each figure you need before writing. Do not state a figure you did not get from a tool.
  3. Cite only policy IDs that you were given. Do not invent IDs.
  4. Never recommend that a limit or position be changed as an action. Say that a human must decide.
  5. Maximum 90 words. Respond with JSON only, matching {"summary": "..."}.

examples:
  - facts: {"desk": "DESK_EQ", "metric_label": "one-day 99% VaR", "value": 412000, "limit": 300000, "utilisation": 1.37, "status": "BREACH", "classification": "market_move", "top_driver": "EQ_ALPHA", "top_share": 0.46, "escalate": false}
    citations: ["limit_policy#breach-response"]
    output: {"summary": "Desk DESK_EQ one-day 99% VaR is 412,000 against a hard limit of 300,000, which is 137% utilisation (status BREACH). Classification: market_move. Largest component driver: EQ_ALPHA, contributing 46% of the total. Escalated: no. Policy reference: limit_policy#breach-response. A human must decide the next step."}
  - facts: {"desk": "DESK_FX", "metric_label": "one-day 99% VaR", "value": 95000, "limit": 120000, "utilisation": 0.79, "status": "OK", "classification": "data_issue", "top_driver": "FX_AUDUSD", "top_share": 0.31, "escalate": true}
    citations: ["escalation_matrix#data-incidents"]
    output: {"summary": "Desk DESK_FX one-day 99% VaR is 95,000 against a hard limit of 120,000, which is 79% utilisation (status OK). Classification: data_issue. A failed price check was found, so the figure is provisional. Escalated: yes, to the data owner. Policy reference: escalation_matrix#data-incidents. A human must confirm the price before any conclusion."}

template: |
  FACTS (JSON, from the risk engine): {facts}
  CITATIONS (the only policy IDs you may cite): {citations}
  Write the note as JSON with the single key "summary".

tool_prompt: |
  A breach needs a note. Desk: {desk}. Metric: {metric}. Classification already decided by the engine: {classification}.
  First call limit_status and attribution for this desk. Call data_checks if the classification is data_issue.
  Then write the note as JSON with the single key "summary", using only figures returned by the tools.
  The note must name the desk, and must state the classification as "{classification}" in words (for example "market move", "data issue" or "limit error").
